
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1440 300"
  preserveAspectRatio="none"
  fill="none"
>
  <defs>
    <!-- Soft, distant landscape silhouettes -->
    <linearGradient id="hills-distant"
      x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B6D4BB" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#D4E7CB" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Main meadow: green edges, warm yellow centre -->
    <linearGradient id="hills-meadow"
      x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%" stop-color="#C4DC94"/>
      <stop offset="48%" stop-color="#F1EDB4"/>
      <stop offset="100%" stop-color="#C8DC98"/>
    </linearGradient>

    <!-- Soft foreground grass -->
    <linearGradient id="hills-foreground"
      x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B4D38C"/>
      <stop offset="50%" stop-color="#DAE4A8"/>
      <stop offset="100%" stop-color="#B0D18A"/>
    </linearGradient>

    <filter id="hills-soften"
      x="-5%" y="-15%" width="110%" height="130%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Distant, softly faded hills -->
  <path
    d="
      M 0 178
      C 100 150, 170 174, 250 145
      C 330 110, 400 100, 470 143
      C 550 175, 610 174, 685 193
      C 770 200, 825 184, 885 170
      C 960 144, 1015 165, 1085 147
      C 1170 115, 1245 116, 1320 145
      C 1370 160, 1415 155, 1440 166
      L 1440 300
      L 0 300 Z
    "
    fill="url(#hills-distant)"
    opacity="0.65"
    filter="url(#hills-soften)"
  />

  <!-- Main landscape: left hill, valley, right hill -->
  <path
    d="
      M 0 111
      C 145 105, 240 143, 362 178
      C 480 213, 595 250, 720 250
      C 845 250, 960 214, 1080 179
      C 1200 145, 1325 102, 1440 96
      L 1440 300
      L 0 300 Z
    "
    fill="url(#hills-meadow)"
  />

  <!-- Overlapping foreground slope -->
  <path
    d="
      M 0 208
      C 160 202, 295 245, 465 274
      C 560 293, 650 300, 720 300
      C 815 300, 910 285, 1008 258
      C 1160 220, 1305 194, 1440 201
      L 1440 300
      L 0 300 Z
    "
    fill="url(#hills-foreground)"
    opacity="0.65"
  />
</svg>
