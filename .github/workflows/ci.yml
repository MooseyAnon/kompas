name: Public CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Provision pinned offline runtime
        run: node scripts/provision-whisper.mjs
      - run: npm test
      - run: npm run make
      - run: npm run release:acceptance:unsigned
      - name: Deterministic packaged journeys
        run: npm run smoke
      # Live Ollama, microphone/TCC and personal-browser tests are owner gates.
      # No live-test flags are set here; see docs/RELEASING.md.
