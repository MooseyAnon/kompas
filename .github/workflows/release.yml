name: Signed draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      - name: Validate public repository and authorised source before install
        run: node scripts/release-guard.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          KOMPAS_RELEASE_REPOSITORY: ${{ vars.KOMPAS_RELEASE_REPOSITORY }}
          KOMPAS_RELEASE_COMMIT: ${{ vars.KOMPAS_RELEASE_COMMIT }}

  draft:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 60
    # Owner must configure required reviewers and v* deployment restrictions.
    environment: macos-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Revalidate source after environment approval
        run: node scripts/release-guard.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          KOMPAS_RELEASE_REPOSITORY: ${{ vars.KOMPAS_RELEASE_REPOSITORY }}
          KOMPAS_RELEASE_COMMIT: ${{ vars.KOMPAS_RELEASE_COMMIT }}

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: node scripts/provision-whisper.mjs
      - run: npm test
      - name: Unsigned packaged smoke before importing credentials
        run: npm run make && npm run smoke

      - name: Import ephemeral Apple credentials
        run: node scripts/release-keychain.mjs setup
        env:
          KOMPAS_CERTIFICATE_P12_BASE64: ${{ secrets.KOMPAS_CERTIFICATE_P12_BASE64 }}
          KOMPAS_CERTIFICATE_PASSWORD: ${{ secrets.KOMPAS_CERTIFICATE_PASSWORD }}
          KOMPAS_SIGN_IDENTITY: ${{ secrets.KOMPAS_SIGN_IDENTITY }}
          KOMPAS_APPLE_ID: ${{ secrets.KOMPAS_APPLE_ID }}
          KOMPAS_APPLE_PASSWORD: ${{ secrets.KOMPAS_APPLE_PASSWORD }}
          KOMPAS_APPLE_TEAM_ID: ${{ secrets.KOMPAS_APPLE_TEAM_ID }}

      - name: Fresh signed and notarised DMG and ZIP
        run: npm run make:signed
        env:
          KOMPAS_SIGN_IDENTITY: ${{ secrets.KOMPAS_SIGN_IDENTITY }}
          GH_TOKEN: ${{ github.token }}
          KOMPAS_RELEASE_REPOSITORY: ${{ vars.KOMPAS_RELEASE_REPOSITORY }}
          KOMPAS_RELEASE_COMMIT: ${{ vars.KOMPAS_RELEASE_COMMIT }}

      - name: Verify artifacts and create or reuse tag draft (never publish)
        run: npm run release
        env:
          GH_TOKEN: ${{ github.token }}
          KOMPAS_RELEASE_REPOSITORY: ${{ vars.KOMPAS_RELEASE_REPOSITORY }}
          KOMPAS_RELEASE_COMMIT: ${{ vars.KOMPAS_RELEASE_COMMIT }}

      - name: Remove temporary keychain and private files
        if: always()
        run: node scripts/release-keychain.mjs cleanup
